<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Where's My Pilot - Spirit Tracker</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background: #000; color: #0f0; margin: 0; padding: 15px; text-align: center; }
        h1 { color: #fff; margin: 10px 0; font-size: 1.8em; }
        button { margin: 8px; padding: 10px 20px; font-size: 1.1em; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #content { white-space: pre-wrap; background: #111; padding: 15px; border-radius: 8px; max-width: 900px; margin: 15px auto; text-align: left; font-size: 1.1em; line-height: 1.5; }
        #map { height: 70vh; min-height: 400px; margin: 20px auto; max-width: 100%; border: 2px solid #333; border-radius: 8px; }
        .hidden { display: none; }
        h2 { color: #fff; margin: 25px 0 10px; font-size: 1.5em; }
    </style>
</head>
<body>
    <h1>Where's My Pilot - Spirit Tracker</h1>
    <button id="authorize_button" disabled>Authorize with Google</button>
    <button id="signout_button" class="hidden">Sign Out</button>

    <div id="content">Loading Google services... please wait.</div>

    <h2>Live Spirit & Friend Aircraft Map</h2>
    <div id="map"></div>

    <!-- Google scripts -->
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

    <script>
        const CLIENT_ID = '961392156388-9r17ndoonmu4kvj7v3lrvtpm8ooipa7o.apps.googleusercontent.com';
        const API_KEY = 'AIzaSyD7sKjm4XmJSPxq3iNfa-GF53J-F4UovHI'; // ← Replace with your actual key
        const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest';
        const SCOPES = 'https://www.googleapis.com/auth/calendar.readonly';

        const FRIEND_TAILS = [
            { tail: 'N114JD', name: 'N114JD' },
            { tail: 'N4303B', name: 'DOLLY' }
        ];

        let tokenClient;
        let gapiReady = false;
        let gisReady = false;
        let flightMap;
        let markers = {};

        function initMap() {
            flightMap = L.map('map').setView([42.3314, -83.0458], 7);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(flightMap);
        }

        function checkReady() {
            console.log('checkReady called - gapiReady:', gapiReady, 'gisReady:', gisReady);
            if (gapiReady && gisReady) {
                document.getElementById('authorize_button').disabled = false;
                document.getElementById('content').innerText = 'Google services ready! Click Authorize to load flights.';
                console.log('Authorize button enabled');
            }
        }

        function gapiLoaded() {
            console.log('gapi script loaded');
            gapi.load('client', async () => {
                try {
                    await gapi.client.init({
                        apiKey: API_KEY,
                        discoveryDocs: [DISCOVERY_DOC],
                    });
                    console.log('gapi.client initialized successfully');
                    gapiReady = true;
                    checkReady();
                } catch (err) {
                    console.error('gapi init failed:', err);
                    document.getElementById('content').innerText = 'Google API init failed: ' + err.message;
                }
            });
        }

        function gisLoaded() {
            console.log('GIS script loaded');
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: async (resp) => {
                    if (resp.error) {
                        document.getElementById('content').innerText = 'Authorization failed: ' + resp.error;
                        console.error('Token error:', resp);
                        return;
                    }
                    document.getElementById('signout_button').classList.remove('hidden');
                    document.getElementById('authorize_button').innerText = 'Refresh Flights';
                    await listUpcomingEvents();
                },
            });
            gisReady = true;
            checkReady();
        }

        async function listUpcomingEvents() {
            try {
                if (!gapi.client || !gapi.client.calendar) throw new Error('API client not ready');

                const request = {
                    calendarId: '5cccae2970c15e751e9c2e23944e500a99e8cf04657e4c24508b3e9cb5b1b9eb@group.calendar.google.com',
                    timeMin: (new Date()).toISOString(),
                    showDeleted: false,
                    singleEvents: true,
                    maxResults: 20,
                    orderBy: 'startTime'
                };

                const response = await gapi.client.calendar.events.list(request);
                let events = response.result.items || [];

                events = events.filter(event => /\d{4}/.test(event.summary || ''));

                let output = events.length === 0 
                    ? 'No Spirit flights found in calendar.' 
                    : 'Upcoming Spirit Flights:\n\n';

                events.forEach(event => {
                    const start = event.start?.dateTime
                        ? new Date(event.start.dateTime).toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
                        : event.start?.date || 'No date';
                    output += `✈️ ${event.summary || 'Spirit Flight'} - ${start}\n`;
                    if (event.description) output += `Details: ${event.description}\n\n`;
                });

                document.getElementById('content').innerText = output;

                updateAllAircraftOnMap(events);

                if (!window.refreshInterval) {
                    window.refreshInterval = setInterval(listUpcomingEvents, 300000);
                    console.log('Auto-refresh every 5 min started');
                }

            } catch (err) {
                document.getElementById('content').innerText = 'Error loading flights: ' + err.message;
                console.error('Calendar error:', err);
            }
        }

        async function updateAllAircraftOnMap(calendarEvents) {
            if (!Array.isArray(calendarEvents)) {
                console.warn('calendarEvents not array - using empty:', calendarEvents);
                calendarEvents = [];
            }

            Object.values(markers).forEach(m => flightMap.removeLayer(m));
            markers = {};

            const bounds = L.latLngBounds();
            let aircraftFound = false;

            // Spirit flights
            for (const event of calendarEvents) {
                const summary = event.summary || '';
                const flightMatch = summary.match(/(\d{4})/);
                if (!flightMatch) continue;
                const flightNum = flightMatch[1];
                const callsign = 'NKS' + flightNum;

                try {
                    const res = await fetch(`https://adsbexchange.com/api/aircraft/call/${callsign}/`);
                    const contentType = res.headers.get('content-type');
                    if (!contentType || !contentType.includes('application/json')) {
                        const text = await res.text();
                        console.log(`Non-JSON for ${callsign} (${res.status}): ${text.substring(0, 100)}...`);
                        continue;
                    }

                    const data = await res.json();
                    console.log(`Result for ${callsign}:`, data);

                    const ac = data.acList?.[0];
                    if (ac && ac.Lat && ac.Long) {
                        addMarker(ac.Lat, ac.Long, {
                            title: callsign,
                            desc: summary,
                            tail: ac.Reg || 'Unknown',
                            alt: ac.Alt ? Math.round(ac.Alt * 3.28) + ' ft' : '?',
                            spd: ac.Spd || '?'
                        });
                        bounds.extend([ac.Lat, ac.Long]);
                        aircraftFound = true;
                    }
                } catch (e) {
                    console.log(`Fetch/parse failed for ${callsign}:`, e.message);
                }
            }

            // Friend tails
            for (const friend of FRIEND_TAILS) {
                try {
                    const res = await fetch(`https://adsbexchange.com/api/aircraft/reg/${friend.tail}/`);
                    const contentType = res.headers.get('content-type');
                    if (!contentType || !contentType.includes('application/json')) continue;

                    const data = await res.json();
                    const ac = data.acList?.[0];
                    if (ac && ac.Lat && ac.Long) {
                        addMarker(ac.Lat, ac.Long, {
                            title: friend.name,
                            desc: 'Friend aircraft',
                            tail: friend.tail,
                            alt: ac.Alt ? Math.round(ac.Alt * 3.28) + ' ft' : '?',
                            spd: ac.Spd || '?'
                        });
                        bounds.extend([ac.Lat, ac.Long]);
                        aircraftFound = true;
                    }
                } catch (e) {}
            }

            if (aircraftFound) {
                flightMap.fitBounds(bounds, { padding: [50, 50], maxZoom: 10, minZoom: 3 });
            } else {
                flightMap.setView([42.3314, -83.0458], 7);
            }
        }

        function addMarker(lat, lon, info) {
            const key = info.tail || info.title;
            if (markers[key]) flightMap.removeLayer(markers[key]);

            const popup = `
                <b>${info.title}</b><br>
                ${info.desc}<br>
                Tail: ${info.tail}<br>
                Altitude: ${info.alt}<br>
                Speed: ${info.spd} kts
            `;

            const marker = L.marker([lat, lon]).addTo(flightMap).bindPopup(popup);
            markers[key] = marker;
        }

        // Button handlers
        document.getElementById('authorize_button').onclick = () => {
            if (!gapiReady || !gisReady) {
                alert('Google services still loading - wait a moment.');
                return;
            }
            tokenClient.requestAccessToken({prompt: ''});
        };

        document.getElementById('signout_button').onclick = () => {
            google.accounts.oauth2.revoke(gapi.client.getToken()?.access_token || '');
            gapi.client.setToken('');
            document.getElementById('content').innerText = 'Signed out. Click Authorize to reconnect.';
            document.getElementById('authorize_button').innerText = 'Authorize with Google';
            document.getElementById('signout_button').classList.add('hidden');
        };

        initMap();
        setInterval(updateAllAircraftOnMap, 60000);
        updateAllAircraftOnMap([]); // Initial
    </script>
</body>
</html>
